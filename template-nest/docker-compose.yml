name: {{project-slug}}

services:
  app:
    container_name: {{project-slug}}-app
    build:
      context: .
      target: dev
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@{{project-slug}}-postgres:5432/{{project_db}}_dev
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    container_name: {{project-slug}}-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: {{project_db}}_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:

# No Redis by default — the example module doesn't cache anything. A module
# that needs one (cache, queue) adds its own service here plus a client in
# shared/, once that need is real and confirmed with the user — see
# "Start simple" in docs/architecture.md.
